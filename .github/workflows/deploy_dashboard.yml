name: Deploy NaijaStock Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 5'  # Friday at 7 PM WAT

permissions:
  contents: write
  pages: write
  id-token: write



jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build signal-generation image
        run: |
          docker build \
            -f database_setup/Dockerfile.ta-pandas \
            -t naijastock-signal-generator \
            .

      - name: Import historical model data
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            naijastock-signal-generator \
            python database_setup/import_historical_data.py

      - name: Generate weekly signals
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            naijastock-signal-generator

      - name: Export website data
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            naijastock-signal-generator \
            python database_setup/export_web_data.py

      - name: Commit updated database and website data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add database_setup/naijastock.db
          git add site/data/stocks.json
          git add site/data/signals.json
          git add site/data/metadata.json

          if git diff --cached --quiet; then
            echo "No database or website-data changes to commit."
          else
            git commit -m "Update weekly signals and website data"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
