name: Daily Stock Data Fetcher

on:
  schedule:
    - cron: '0 17 * * 1-5'  # Mon–Fri at 6PM WAT (WAT is UTC+1)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: python -m pip install pandas==2.2.2 selenium==4.21.0 webdriver-manager==4.0.2

    - name: Run stock data fetch script
      run: python database_setup/fetch_stock_data.py

    - name: Export daily website data
      run: python database_setup/export_web_data.py

    - name: Commit and push daily data
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add database_setup/naijastock.db
        git add site/data/stocks.json
        git add site/data/metadata.json
        if git diff --cached --quiet; then
          echo "No daily data changes to commit."
        else
          git commit -m "Update daily stock and website data"
          git push
        fi

    - name: Configure GitHub Pages
      uses: actions/configure-pages@v5

    - name: Upload website
      uses: actions/upload-pages-artifact@v4
      with:
        path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: fetch

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
