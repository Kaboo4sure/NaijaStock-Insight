name: Daily Stock Data Fetcher

on:
  schedule:
    - cron: '0 17 * * 1-5'  # Mon–Fri at 6PM WAT (WAT is UTC+1)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: python -m pip install pandas==2.2.2 selenium==4.21.0 webdriver-manager==4.0.2

    - name: Run stock data fetch script
      run: python database_setup/fetch_stock_data.py

    - name: Commit and push database changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add database_setup/naijastock.db
        if git diff --cached --quiet; then
          echo "No database changes to commit."
        else
          git commit -m "Update stock database"
          git push
        fi
